# Publishes the review preview of /digest/2026-10-28 to GitHub Pages (plan.md § 3 and § 4, ADR 0003).
# The page is built here and never committed. The marker comes from the LANE_MARKER repo secret;
# run with "marker: false" to upload over the same link with the marker unset (§ 4 clean-up).
name: preview
on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to save
        default: '2026-10-28'
      marker:
        description: Include the lane marker banner
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the digest page as one HTML file
        env:
          LANE_ID: ${{ secrets.LANE_ID }}
          LANE_MARKER: ${{ inputs.marker && secrets.LANE_MARKER || '' }}
        run: scripts/save-preview.sh "${{ inputs.night }}" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
